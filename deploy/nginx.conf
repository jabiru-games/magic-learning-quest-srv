# Variante si nginx tient déjà les ports 80/443 du serveur : le conteneur écoute alors
# sur 127.0.0.1:8787 (voir le README) et le certificat est géré par certbot.
server {
    listen 443 ssl http2;
    server_name magic-learning-quest-srv.jabiru-software.com;
    ssl_certificate     /etc/letsencrypt/live/magic-learning-quest-srv.jabiru-software.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic-learning-quest-srv.jabiru-software.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
