# Variante Apache, sans Docker : le service Node écoute sur 127.0.0.1:8787
# (voir duels.service) et Apache relaie le domaine vers lui.
# Modules requis : proxy, proxy_http, proxy_wstunnel, rewrite.
# Ici le TLS est assuré en amont (Cloudflare) ; pour servir le HTTPS depuis
# Apache, reprendre ce bloc dans un <VirtualHost *:443> avec un certificat.
<VirtualHost *:80>
	ServerName magic-learning-quest-srv.jabiru-software.com

	RewriteEngine On
	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule ^/ws$ ws://127.0.0.1:8787/ws [P,L]

	ProxyPass        / http://127.0.0.1:8787/
	ProxyPassReverse / http://127.0.0.1:8787/
	ProxyTimeout 120

	ErrorLog  ${APACHE_LOG_DIR}/magic-learning-quest-srv-error.log
	CustomLog ${APACHE_LOG_DIR}/magic-learning-quest-srv-access.log combined
</VirtualHost>
